
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - EduManage</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="sidebar">
    <h2>🎓 EduManage</h2>

    <p class="side-title">MAIN MENU</p>

    <a href="/">🏠 Dashboard</a>
    <a href="/#students">👨‍🎓 Students</a>
    <a href="/add-student" class="active">➕ Add Student</a>
    <a href="/#reports">📊 Reports</a>

    <div class="sidebar-bottom">
        <p>Student Management System</p>
        <small>Version 1.0</small>
    </div>
</div>

<div class="main-content">

    <header>
        <div>
            <h1>Add New Student</h1>
            <p>Enter the student information below.</p>
        </div>

        <div class="profile">👤 Admin</div>
    </header>

    <section class="content-card form-card">

        <h2>🎓 Student Information</h2>
        <p class="form-description">
            Fill in all the details to register a student.
        </p>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('add_student') }}">

            <div class="form-group">
                <label>Student ID</label>
                <input type="number" name="student_id"
                       placeholder="Enter student ID" required>
            </div>

            <div class="form-group">
                <label>Student Name</label>
                <input type="text" name="name"
                       placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age"
                       placeholder="Enter age" min="1" required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <select name="department" required>
                    <option value="">Select Department</option>
                    <option value="CSE">Computer Science (CSE)</option>
                    <option value="IT">Information Technology (IT)</option>
                    <option value="ECE">Electronics (ECE)</option>
                    <option value="EEE">Electrical (EEE)</option>
                    <option value="MECH">Mechanical (MECH)</option>
                    <option value="CIVIL">Civil (CIVIL)</option>
                    <option value="AIML">AI and Machine Learning (AIML)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Marks</label>
                <input type="number" name="marks"
                       placeholder="Enter marks (0-100)"
                       min="0" max="100" step="0.01" required>
            </div>

            <div class="form-buttons">
                <button type="submit" class="save-btn">
                    💾 Save Student
                </button>

                <a href="/" class="cancel-btn">Cancel</a>
            </div>

        </form>

    </section>

</div>

</body>
</html>
